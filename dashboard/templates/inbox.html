<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}"><title>Rentee Inbox</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
  <script src="{{ url_for('static', filename='inbox.js') }}" defer></script>
</head>
<body class="inbox-page">
  <header class="topbar inbox-topbar">
    <div class="brand"><span class="brand-mark">R</span><span>rentee</span></div>
    <div class="actions"><nav class="nav"><a href="{{ url_for('dashboard') }}">Dashboard</a><a class="active" href="{{ url_for('inbox') }}">Inbox</a></nav>
      <form action="{{ url_for('logout') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="quiet" type="submit">Log out</button></form>
    </div>
  </header>
  <main class="inbox-shell">
    <aside class="chat-list"><div class="chat-list-head"><h1>Inbox</h1><input id="chat-search" type="search" placeholder="Search name or phone" aria-label="Search conversations"></div><div id="conversations"><p class="empty">Loading conversations…</p></div></aside>
    <section class="chat-view" id="chat-view"><div class="chat-empty"><strong>Rentee WhatsApp Inbox</strong><span>Select a conversation to view its message history.</span></div></section>
  </main>
</body></html>
