<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Rentee Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
  <script src="{{ url_for('static', filename='dashboard.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">R</span><span>rentee</span></div>
    <div class="actions">
      <button id="refresh" class="quiet" type="button">Refresh</button>
      <form action="{{ url_for('logout') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="quiet" type="submit">Log out</button>
      </form>
    </div>
  </header>
  <main class="shell">
    <section class="intro">
      <div><p class="eyebrow">Platform overview</p><h1>Good to see you, Gwen.</h1></div>
      <label class="range-label">Date range
        <select id="range">
          <option value="today">Today</option><option value="7d">Last 7 days</option>
          <option value="30d">Last 30 days</option><option value="all">All time</option>
        </select>
      </label>
    </section>
    <div id="error" class="notice error hidden" role="alert"></div>
    <section class="metrics" aria-label="Activity metrics">
      <article class="metric"><span>Leads added</span><strong data-stat="leads">—</strong></article>
      <article class="metric"><span>Listings added</span><strong data-stat="listings">—</strong></article>
      <article class="metric"><span>Matches created</span><strong data-stat="matches">—</strong></article>
      <article class="metric accent"><span>Match alerts sent</span><strong data-stat="alerts_sent">—</strong></article>
    </section>
    <section class="network">
      <div><p>Total users</p><strong data-stat="total_users">—</strong></div>
      <div><p>Users with alerts enabled</p><strong data-stat="users_alerts_enabled">—</strong></div>
    </section>
    <section class="recent">
      <div class="section-title"><div><p class="eyebrow">Latest activity</p><h2>Recent match alerts</h2></div><span id="updated" class="muted"></span></div>
      <div id="alerts" class="alert-list"><p class="empty">Loading alerts…</p></div>
    </section>
  </main>
</body>
</html>
